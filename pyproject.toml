[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-du"
version = "0.1.0"
description = "Song-disjoint dynamic music emotion prediction with disagreement and conformal uncertainty"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0", "scipy>=1.10", "torch>=2.1", "librosa>=0.10", "soundfile>=0.12", "scikit-learn>=1.3"]

[project.optional-dependencies]
baselines = ["xgboost>=2.0", "joblib>=1.3"]
merp = ["pyarrow>=14", "huggingface_hub>=0.25"]
mert = ["transformers>=4.38,<5", "torchaudio>=2.1", "accelerate>=0.27"]
test = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
musedu = "musedu.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"
